<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You, Nousa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.6), 
                         0 0 20px rgba(255, 51, 102, 0.4);
            animation: pulse 2s infinite alternate;
            margin-bottom: 20px;
        }

        .signature {
            font-size: 1.5rem;
            color: #a0a0c0;
            font-style: italic;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            color: #ff3366;
            pointer-events: none;
            will-change: transform, opacity;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(var(--scale));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>I Love You, Nousa</h1>
        <div class="signature">Your Lover</div>
    </div>

    <script>
        const heartColors = ['#ff3366', '#ff6699', '#ff0055', '#ff99bb', '#ff4d4d'];

        document.addEventListener('click', (e) => {
            const heartCount = 15; 
            for (let i = 0; i < heartCount; i++) {
                createHeart(e.clientX, e.clientY);
            }
        });

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;

            const randomColor = heartColors[Math.floor(Math.random() * heartColors.length)];
            heart.style.color = randomColor;

            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 150; 
            const tx = Math.cos(angle) * velocity - 50 + 'px';
            const ty = Math.sin(angle) * velocity - 50 + 'px';
            const scale = 0.5 + Math.random() * 1.5;

            heart.style.setProperty('--tx', tx);
            heart.style.setProperty('--ty', ty);
            heart.style.setProperty('--scale', scale);

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1500);
        }
    </script>
</body>
</html>
